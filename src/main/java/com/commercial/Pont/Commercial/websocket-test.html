<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <title>Test WebSocket - Pont Commercial</title>

    <!-- STOMP JS -->
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.1/bundles/stomp.umd.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            padding: 10px;
            background: #eee;
        }

        #messages {
            margin-top: 20px;
            padding: 15px;
            background: #111;
            color: white;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .message {
            border-bottom: 1px solid #555;
            padding: 10px 0;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Test WebSocket / STOMP</h1>

    <label>Utilisateur</label>

    <input
            id="username"
            type="text"
            placeholder="name"
    >


    <label>Conversation ID</label>

    <input
            id="conversationId"
            type="text"
            placeholder="UUID de la conversation"
    >


    <button onclick="connect()">
        Connecter
    </button>

    <button onclick="disconnect()">
        Déconnecter
    </button>


    <div id="status">
        Statut : Déconnecté
    </div>


    <h2>Messages reçus</h2>

    <div id="messages"></div>

</div>


<script>

    let stompClient = null;


    // =====================================================
    // CONNECT
    // =====================================================

    function connect() {

        const username =
            document.getElementById("username").value;

        const conversationId =
            document.getElementById("conversationId").value;


        if (!username) {

            alert("Veuillez entrer le nom de l'utilisateur");

            return;
        }


        if (!conversationId) {

            alert("Veuillez entrer le conversationId");

            return;
        }


        stompClient = new StompJs.Client({

            brokerURL: "ws://localhost:8080/ws",

            reconnectDelay: 5000,

            debug: function (str) {

                console.log(str);

            }

        });


        // =================================================
        // CONNECTED
        // =================================================

        stompClient.onConnect = function (frame) {

            console.log("STOMP CONNECTED");

            console.log(frame);


            document.getElementById("status").innerText =
                "Connecté en STOMP : " + username;


            // =============================================
            // SUBSCRIBE
            // =============================================

            const destination =
                "/topic/conversations/" + conversationId;


            console.log(
                "Subscription : " + destination
            );


            stompClient.subscribe(
                destination,
                function (message) {

                    console.log(
                        "Message reçu :",
                        message
                    );


                    displayMessage(
                        message.body
                    );

                }
            );


            addSystemMessage(
                "Abonné à : " + destination
            );

        };


        // =================================================
        // ERROR
        // =================================================

        stompClient.onStompError = function (frame) {

            console.error(
                "Erreur STOMP :",
                frame
            );


            document.getElementById("status").innerText =
                "Erreur STOMP";

        };


        // =================================================
        // WEBSOCKET ERROR
        // =================================================

        stompClient.onWebSocketError = function (error) {

            console.error(
                "Erreur WebSocket :",
                error
            );


            document.getElementById("status").innerText =
                "Erreur WebSocket";

        };


        // =================================================
        // ACTIVER CLIENT
        // =================================================

        stompClient.activate();

    }


    // =====================================================
    // DISCONNECT
    // =====================================================

    function disconnect() {

        if (stompClient) {

            stompClient.deactivate();

            stompClient = null;

            document.getElementById("status").innerText =
                "Déconnecté";

            addSystemMessage(
                "WebSocket déconnecté"
            );
        }

    }


    // =====================================================
    // DISPLAY MESSAGE
    // =====================================================

    function displayMessage(body) {

        const messagesDiv =
            document.getElementById("messages");


        const div =
            document.createElement("div");


        div.className = "message";


        try {

            const data =
                JSON.parse(body);


            div.innerText =
                JSON.stringify(
                    data,
                    null,
                    2
                );

        } catch (error) {

            div.innerText = body;

        }


        messagesDiv.appendChild(div);


        messagesDiv.scrollTop =
            messagesDiv.scrollHeight;

    }


    // =====================================================
    // SYSTEM MESSAGE
    // =====================================================

    function addSystemMessage(text) {

        const messagesDiv =
            document.getElementById("messages");


        const div =
            document.createElement("div");


        div.className = "message";


        div.innerText =
            "[SYSTEM] " + text;


        messagesDiv.appendChild(div);

    }

</script>

</body>

</html>
